  <style>
    :root { 
      --primary: #25D366; 
      --dark: #090d16; 
      --card: #131c2e; 
      --card-hover: #1a2540;
      --text: #f8fafc; 
      --muted: #94a3b8;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--dark); 
      color: var(--text); 
      width: 100%; max-width: 100vw; overflow-x: hidden; 
    }
    body { padding-bottom: 60px; }

    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 1.5rem 1rem; text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1); width: 100%;
    }
    .logo {
      font-size: 2.5rem; font-weight: 800; letter-spacing: 3px;
      margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #25D366 0%, #3b82f6 50%, #8b5cf6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline { color: var(--muted); font-size: 0.9rem; }
    
    .section-title { 
      text-align: center; font-size: 1.3rem; font-weight: 800;
      margin: 1.5rem 1rem 1rem; color: var(--text);
    }
    
    .categories { padding: 0 1rem; width: 100%; }
    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .cat-btn {
      background: var(--card); border: 1px solid rgba(255,255,255,0.1);
      padding: 1.5rem 0.5rem; border-radius: 14px; text-align: center;
      text-decoration: none; color: var(--text); font-weight: 700; font-size: 0.95rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      cursor: pointer; transition: all 0.3s ease;
    }
    .cat-btn:active { transform: scale(0.95); background: var(--card-hover); }
    .cat-btn span { font-size: 2.5rem; }
    
    .back-btn {
      display: none; margin: 1rem; padding: 0.8rem 1.5rem;
      background: var(--card); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: var(--text); font-weight: 700; font-size: 0.9rem;
      cursor: pointer; transition: all 0.3s ease;
    }
    .back-btn:active { transform: scale(0.95); background: var(--card-hover); }
    .back-btn.visible { display: inline-block; }
    
    .products { padding: 0 1rem; width: 100%; display: none; }
    .products.visible { display: block; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .product-card {
      background: var(--card); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; overflow: hidden; text-decoration: none;
      color: var(--text); display: flex; flex-direction: column; transition: all 0.3s ease;
    }
    .product-card:active { transform: scale(0.97); }
    .product-img { width: 100%; height: 140px; object-fit: cover; background: #1e293b; display: block; }
    .product-info { padding: 0.75rem; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.2; min-height: 2.4em; }
    .product-price-container { margin-bottom: 0.4rem; }
    .product-price { color: var(--primary); font-weight: 800; font-size: 1rem; }
    .product-price-old { color: var(--muted); font-size: 0.75rem; text-decoration: line-through; margin-left: 0.3rem; }
    .product-shipping { 
      font-size: 0.6rem; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.3px;
      background: rgba(59, 130, 246, 0.1);
      padding: 0.3rem 0.4rem; border-radius: 4px; margin-top: auto;
    }
    
    .category-header {
      display: none; text-align: center; padding: 0.5rem 1rem;
      font-size: 1.1rem; font-weight: 700; color: var(--primary);
    }
    .category-header.visible { display: block; }
    
    footer { 
      text-align: center; padding: 2rem 1rem; color: var(--muted);
      font-size: 0.75rem; margin-top: 2rem;
    }
    footer .brand { 
      color: var(--text); font-weight: 700;
      background: linear-gradient(135deg, #25D366, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
  </style>
</head>

  <!-- SCRIPT DE AUTODESTRUCCIÓN DEL CACHÉ DEL SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
          console.log('Service Worker antiguo eliminado forzosamente');
        }
      });
    }
  </script>

  <script>
  (function() {
      const diasPrueba = 7;
      const clave = 'pywi_demo_inicio_' + window.location.hostname;
      let inicio = localStorage.getItem(clave);
      if (!inicio) { inicio = new Date().getTime(); localStorage.setItem(clave, inicio); }
      const diasTranscurridos = Math.ceil((new Date().getTime() - inicio) / (1000 * 3600 * 24));
      if (diasTranscurridos >= diasPrueba) { window.location.href = './prueba-expirada.html'; }
  })();
  </script>
