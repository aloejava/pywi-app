    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      background-color: #090d16; 
      color: #f8fafc; 
      padding-bottom: 60px;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 1.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 0.3rem;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline { color: #94a3b8; font-size: 0.9rem; }
    .section-title { 
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      margin: 1.5rem 1rem 1rem;
    }
    .categories { padding: 0 1rem; }
    .cat-grid { 
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .cat-btn {
      background: #131c2e;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1.5rem 0.5rem;
      border-radius: 14px;
      text-align: center;
      color: #f8fafc;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .cat-btn:active { transform: scale(0.95); background: #1a2540; }
    .cat-btn span { font-size: 2.5rem; }
    .back-btn {
      display: none;
      margin: 1rem;
      padding: 0.8rem 1.5rem;
      background: #131c2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #f8fafc;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .products { padding: 0 1rem; display: none; }
    .product-grid { 
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .product-card {
      background: #131c2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
    }
    .product-card:active { transform: scale(0.97); }
    .product-img { 
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #1e293b;
      display: block;
    }
    .product-info { padding: 0.75rem; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.2; }
