<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pywi - Tu Tienda en el Bolsillo</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="logo-192.png">
  <meta name="theme-color" content="#090d16">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #090d16; 
      color: #f8fafc; 
      padding-bottom: 60px;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 1.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #25D366 0%, #3b82f6 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline { color: #94a3b8; font-size: 0.9rem; }
    .section-title { 
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      margin: 1.5rem 1rem 1rem;
    }
    .categories { padding: 0 1rem; }
    .cat-grid { 
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .cat-btn {
      background: #131c2e;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1.5rem 0.5rem;
      border-radius: 14px;
      text-align: center;
      color: #f8fafc;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .cat-btn:active { transform: scale(0.95); background: #1a2540; }
    .cat-btn span { font-size: 2.5rem; }
    .back-btn {
      display: none;
      margin: 1rem;
      padding: 0.8rem 1.5rem;
      background: #131c2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #f8fafc;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .back-btn.visible { display: inline-block; }
    .products { padding: 0 1rem; display: none; }
    .products.visible { display: block; }
    .product-grid { 
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .product-card {
      background: #131c2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
    }
    .product-card:active { transform: scale(0.97); }
    .product-img { 
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #1e293b;
      display: block;
    }
    .product-info { padding: 0.75rem; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.2; }
    .product-price { color: #25D366; font-weight: 800; font-size: 1rem; }
    .product-price-old { color: #94a3b8; font-size: 0.75rem; text-decoration: line-through; margin-left: 0.3rem; }
    .product-shipping { 
      font-size: 0.6rem;
      font-weight: 700;
      color: #3b82f6;
      text-transform: uppercase;
      background: rgba(59, 130, 246, 0.1);
      padding: 0.3rem 0.4rem;
      border-radius: 4px;
      margin-top: auto;
    }
    .category-header {
      display: none;
      text-align: center;
      padding: 0.5rem 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: #25D366;
    }
    .category-header.visible { display: block; }
    footer { 
      text-align: center;
      padding: 2rem 1rem;
      color: #94a3b8;
      font-size: 0.75rem;
      margin-top: 2rem;
    }
    footer .brand { 
      color: #f8fafc;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Pywi</div>
    <p class="tagline">Tu tienda favorita, ahora en tu bolsillo</p>
  </header>

  <h2 class="section-title" id="mainTitle">🛍️ Nuestras Categorías</h2>
  <div class="category-header" id="categoryHeader"></div>
  <button class="back-btn" id="backBtn" onclick="showCategories()">← Volver a categorías</button>

      <div class="cat-btn" onclick="showProducts('hogar')"><span>🏠</span>Hogar</div>
      <div class="cat-btn" onclick="showProducts('mascota')"><span></span>Mascota</div>
      <div class="cat-btn" onclick="showProducts('ropa')"><span>👕</span>Ropa</div>
    </div>
  </div>

  <div class="products" id="productsSection">
    <div class="product-grid" id="productGrid"></div>
  </div>

  <footer>
    <p>© 2026 Pywi - Todos los derechos reservados</p>

    <p style="margin-top: 0.2rem; font-size: 0.7rem;">Mobile Social Marketing</p>
  </footer>
