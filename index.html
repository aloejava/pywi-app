<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pywi - Tu Tienda en el Bolsillo</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#090d16">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #090d16; 
      color: #f8fafc; 
      padding-bottom: 60px;
    }
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 1.5rem 1rem; text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      font-size: 2.5rem; font-weight: 800; letter-spacing: 3px; margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #25D366 0%, #3b82f6 50%, #8b5cf6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .tagline { color: #94a3b8; font-size: 0.9rem; }
    .section-title { text-align: center; font-size: 1.3rem; font-weight: 800; margin: 1.5rem 1rem 1rem; }
    
    .categories { padding: 0 1rem; }
    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .cat-btn {
      background: #131c2e; border: 1px solid rgba(255,255,255,0.1);
      padding: 1.5rem 0.5rem; border-radius: 14px; text-align: center;
      color: #f8fafc; font-weight: 700; font-size: 0.95rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem; cursor: pointer;
    }
    .cat-btn:active { transform: scale(0.95); background: #1a2540; }
    .cat-btn span { font-size: 2.5rem; }
    
    .back-btn {
      display: none; margin: 1rem; padding: 0.8rem 1.5rem;
      background: #131c2e; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: #f8fafc; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    
    .products { padding: 0 1rem; display: none; }
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    .product-card {
      background: #131c2e; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; overflow: hidden; text-decoration: none;
      color: #f8fafc; display: flex; flex-direction: column;
    }
    .product-card:active { transform: scale(0.97); }
    .product-img { width: 100%; height: 140px; object-fit: cover; background: #1e293b; display: block; }
    .product-info { padding: 0.75rem; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.2; }
    .product-price { color: #25D366; font-weight: 800; font-size: 1rem; }
    .product-price-old { color: #94a3b8; font-size: 0.75rem; text-decoration: line-through; margin-left: 0.3rem; }
    .product-shipping { 
      font-size: 0.6rem; font-weight: 700; color: #3b82f6; text-transform: uppercase;
      background: rgba(59, 130, 246, 0.1); padding: 0.3rem 0.4rem; border-radius: 4px; margin-top: auto;
    }
    .category-header { display: none; text-align: center; padding: 0.5rem 1rem; font-size: 1.1rem; font-weight: 700; color: #25D366; }
    
    footer { text-align: center; padding: 2rem 1rem; color: #94a3b8; font-size: 0.75rem; margin-top: 2rem; }
    footer .brand { color: #f8fafc; font-weight: 700; }
    .version-tag { color: #ef4444; font-weight: 800; font-size: 0.7rem; margin-top: 0.5rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Pywi</div>
    <p class="tagline">Tu tienda favorita, ahora en tu bolsillo</p>
  </header>

  <h2 class="section-title" id="mainTitle">🛍️ Nuestras Categorías</h2>
  <div class="category-header" id="categoryHeader"></div>
  <button class="back-btn" id="backBtn" onclick="window.showCategories()">← Volver a categorías</button>

  <div class="categories" id="categoriesSection">
    <div class="cat-grid">
      <div class="cat-btn" onclick="window.showProducts('tecnologia')"><span>📱</span>Tecnología</div>
      <div class="cat-btn" onclick="window.showProducts('belleza')"><span>💄</span>Belleza</div>
      <div class="cat-btn" onclick="window.showProducts('salud')"><span>💊</span>Salud</div>
      <div class="cat-btn" onclick="window.showProducts('hogar')"><span>🏠</span>Hogar</div>
      <div class="cat-btn" onclick="window.showProducts('mascota')"><span>🐾</span>Mascota</div>
      <div class="cat-btn" onclick="window.showProducts('ropa')"><span>👕</span>Ropa</div>
    </div>
  </div>

  <div class="products" id="productsSection">
    <div class="product-grid" id="productGrid"></div>
  </div>

  <footer>
    <p>© 2026 Pywi - Todos los derechos reservados</p>
    <p style="margin-top: 0.5rem;">Created by <span class="brand">MSM</span></p>
    <p style="margin-top: 0.2rem; font-size: 0.7rem;">Mobile Social Marketing</p>
    <p class="version-tag">Versión 3.0 - Diagnóstico Activo</p>
  </footer>

  <script>
    var productos = {
      tecnologia: [
        { nombre: "Audífono Sordera Amplificador", precio: "$53.000", precioOld: "$68.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-471869.jpg" },
        { nombre: "Audífono Traductor con IA", precio: "$66.000", precioOld: "$78.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-588424.jpg" },
        { nombre: "Mini Proyector de Vídeo T500", precio: "$231.965", precioOld: "$265.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-466550.jpg" }
      ],
      belleza: [
        { nombre: "C-LAGEN Colágeno", precio: "$64.300", precioOld: "$93.000", imagen: "https://store-cdn.venndelo.com/shared/image-c-lagen-1092829-i605675-s200x200-f1.jpg" },
        { nombre: "Suero Crecimiento Cabello", precio: "$34.700", precioOld: "$68.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-533788.jpg" },
        { nombre: "Crema Blanqueadora Hismile V34", precio: "$53.000", precioOld: "$68.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-512993.jpg" },
        { nombre: "Lámpara Secador de Uñas UV LED 48W", precio: "$83.000", precioOld: "$108.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-385892.jpg" },
        { nombre: "Shampoo Canas Color Negro x10", precio: "$43.005", precioOld: "$62.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-523773.jpg" }
      ],
      salud: [
        { nombre: "Bisglicinato de Magnesio x60", precio: "$48.900", precioOld: "$84.400", imagen: "https://store-cdn.venndelo.com/shared/image-bisglicinato-de-magnesio-x60und-1091817-i603502-s200x200-f1.jpg" },
        { nombre: "Berberina x60", precio: "$56.390", precioOld: "$79.900", imagen: "https://store-cdn.venndelo.com/shared/imagen-603499.jpg" },
        { nombre: "Photen X x500ml", precio: "$66.900", precioOld: "$98.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-603442.jpg" },
        { nombre: "Cinturón Térmico Cólicos", precio: "$59.300", precioOld: "$78.600", imagen: "https://store-cdn.venndelo.com/shared/imagen-574284.jpg" },
        { nombre: "Blanqueador Dientes Carbón", precio: "$29.400", precioOld: "$44.600", imagen: "https://store-cdn.venndelo.com/shared/imagen-561597.jpg" }
      ],
      hogar: [
        { nombre: "Escurridor de Platos con Tapa 65cm", precio: "$141.000", precioOld: "$158.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-593262.jpg" },
        { nombre: "Picadora Eléctrica de Alimentos 2L", precio: "$83.999", precioOld: "$132.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-602768.jpg" },
        { nombre: "Tendedero Gancho Espira", precio: "$36.900", precioOld: "$62.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-475995.jpg" },
        { nombre: "Organizador Gancho Múltiple 9 en 1", precio: "$22.000", precioOld: "$25.599", imagen: "https://store-cdn.venndelo.com/shared/imagen-415383.jpg" },
        { nombre: "Llave Universal Multiuso", precio: "$51.999", precioOld: "$88.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-352393.jpg" },
        { nombre: "Llave Universal 48 en 1", precio: "$63.645", precioOld: "$68.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-316629.jpg" },
        { nombre: "Bombillos de Mosquito 15W", precio: "$39.000", precioOld: "$48.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-384421.jpg" },
        { nombre: "Grifo Ahorrador y Purificador 360°", precio: "$32.000", precioOld: "$42.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-271083.jpg" },
        { nombre: "Molinillo de Pimienta y Sales", precio: "$63.900", precioOld: "$83.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-476674.jpg" }
      ],
      mascota: [
        { nombre: "Cepillo Masajeador Mascotas 2 en 1", precio: "$24.000", precioOld: "$46.355", imagen: "https://store-cdn.venndelo.com/shared/imagen-472350.jpg" }
      ],
      ropa: [
        { nombre: "Levantador Busto Reutilizable", precio: "$43.000", precioOld: "$56.000", imagen: "https://store-cdn.venndelo.com/shared/imagen-285644.jpg" }
      ]
    };

    var nombresCategorias = {
      tecnologia: "📱 Tecnología", belleza: "💄 Belleza", salud: "💊 Salud",
      hogar: "🏠 Hogar", mascota: "🐾 Mascota", ropa: "👕 Ropa"
    };

    window.showProducts = function(categoria) {
      // PRUEBA DE DIAGNÓSTICO: Si ve esta alerta, el código nuevo SÍ cargó.
      alert("Diagnóstico: Categoría clickeada = " + categoria);
      
      var productosCat = productos[categoria];
      var grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      
      for (var i = 0; i < productosCat.length; i++) {
        var prod = productosCat[i];
        var card = document.createElement('a');
        card.className = 'product-card';
        card.href = 'landing.html?producto=' + encodeURIComponent(prod.nombre) + '&precio=' + encodeURIComponent(prod.precio) + '&imagen=' + encodeURIComponent(prod.imagen);
        card.innerHTML = '<img src="' + prod.imagen + '" alt="' + prod.nombre + '" class="product-img">' +
          '<div class="product-info">' +
            '<div class="product-name">' + prod.nombre + '</div>' +
            '<div><span class="product-price">' + prod.precio + '</span> <span class="product-price-old">' + prod.precioOld + '</span></div>' +
            '<div class="product-shipping">PAGO CONTRA ENTREGA - DOMICILIO GRATIS</div>' +
          '</div>';
        grid.appendChild(card);
      }
      
      document.getElementById('categoriesSection').style.display = 'none';
      document.getElementById('mainTitle').style.display = 'none';
      document.getElementById('productsSection').style.display = 'block';
      document.getElementById('backBtn').style.display = 'inline-block';
      document.getElementById('categoryHeader').style.display = 'block';
      document.getElementById('categoryHeader').innerText = nombresCategorias[categoria];
      window.scrollTo(0, 0);
    };

    window.showCategories = function() {
      document.getElementById('categoriesSection').style.display = 'block';
      document.getElementById('mainTitle').style.display = 'block';
      document.getElementById('productsSection').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('categoryHeader').style.display = 'none';
      window.scrollTo(0, 0);
    };
  </script>
</body>
</html>
