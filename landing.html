<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Realizar Pedido - Pywi</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="logo-192.png">
  <meta name="theme-color" content="#090d16">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #090d16; 
      color: #f8fafc; 
      padding: 1.5rem;
      padding-bottom: 80px;
    }
    .banner-envio {
      background: linear-gradient(135deg, #3b82f6 0%, #25D366 100%);
      color: white;
      text-align: center;
      padding: 0.8rem;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.5px;
    }
    .product-card { 
      background: #131c2e; 
      border-radius: 16px; 
      padding: 1.5rem; 
      text-align: center; 
      margin-bottom: 2rem; 
      border: 1px solid rgba(255,255,255,0.1); 
    }
    .product-img { 
      width: 100%; 
      max-width: 300px; 
      height: 300px; 
      object-fit: contain; 
      border-radius: 12px; 
      margin-bottom: 1rem; 
      background-color: #ffffff;
      padding: 10px;
    }
    .product-name { 
      font-size: 1.4rem; 
      font-weight: 800; 
      margin-bottom: 0.5rem; 
      line-height: 1.3; 
    }
    .product-price { 
      font-size: 1.8rem; 
      font-weight: 700; 
      color: #25D366; 
    }
    .product-old-price {
      font-size: 1rem;
      color: #94a3b8;
      text-decoration: line-through;
      margin-top: 0.3rem;
    }
    .form-container { max-width: 500px; margin: 0 auto; }
    .form-title { 
      text-align: center; 
      margin-bottom: 1.5rem; 
      font-size: 1.2rem; 
      color: #f8fafc; 
    }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { 
      display: block; 
      font-size: 0.85rem; 
      font-weight: 600; 
      color: #94a3b8; 
      margin-bottom: 0.4rem; 
    }
    .form-group input, .form-group select { 
      width: 100%; 
      padding: 1rem; 
      background: #131c2e; 
      border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 8px; 
      color: white; 
      font-size: 1rem; 
      outline: none; 
      transition: border-color 0.2s; 
    }
    .form-group input:focus, .form-group select:focus { 
      border-color: #25D366; 
    }
    .form-group input[readonly] { 
      background: #1e293b; 
      color: #64748b; 
      cursor: not-allowed; 
    }
    .submit-btn { 
      width: 100%; 
      background: #25D366; 
      color: white; 
      border: none; 
      padding: 1.2rem; 
      border-radius: 12px; 
      font-size: 1.1rem; 
      font-weight: 800; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); 
      transition: transform 0.2s, background 0.2s; 
    }
    .submit-btn:hover { transform: translateY(-2px); background: #20bd5a; }
    .submit-btn:disabled { background: #475569; cursor: not-allowed; transform: none; }
    .footer-note { 
      text-align: center; 
      font-size: 0.75rem; 
      color: #94a3b8; 
      margin-top: 1.5rem; 
    }
    .success-msg { 
      display: none; 
      background: rgba(37, 211, 102, 0.15); 
      border: 1px solid #25D366; 
      color: #25D366; 
      padding: 1rem; 
      border-radius: 8px; 
      text-align: center; 
      margin-bottom: 1rem; 
      font-weight: 600; 
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="banner-envio">
    🚚 PAGO CONTRA ENTREGA - DOMICILIO GRATIS
  </div>

  <div class="product-card">
    <img id="prodImg" class="product-img" src="" alt="Producto">
    <h1 id="prodName" class="product-name">Cargando producto...</h1>
    <p id="prodPrice" class="product-price">$0</p>
    <p id="prodOldPrice" class="product-old-price"></p>
  </div>

  <div class="form-container">
    <h2 class="form-title">Completa tus datos de envío</h2>
    
    <div id="successMsg" class="success-msg">
      ✅ Tus datos fueron registrados. Te contactaremos pronto.
    </div>

    <form id="orderForm">
      <div class="form-group">
        <label for="producto">Producto</label>
        <input type="text" id="producto" name="entry.208026899" readonly>
      </div>
      <div class="form-group">
        <label for="precio">Precio</label>
        <input type="text" id="precio" name="entry.625038141" readonly>
      </div>
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="entry.1727265902" placeholder="Ej. Juan Pérez" required>
      </div>
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="entry.826346011" placeholder="Ej. 300 123 4567" required>
      </div>
      <div class="form-group">
        <label for="departamento">Departamento</label>
        <select id="departamento" name="entry.1920667681" required>
          <option value="">Selecciona...</option>
          <option value="Magdalena">Magdalena</option>
          <option value="Atlántico">Atlántico</option>
          <option value="Bogotá D.C.">Bogotá D.C.</option>
          <option value="Antioquia">Antioquia</option>
          <option value="Valle del Cauca">Valle del Cauca</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label for="ciudad">Ciudad / Municipio</label>
        <input type="text" id="ciudad" name="entry.1269154645" placeholder="Ej. Santa Marta" required>
      </div>
      <div class="form-group">
        <label for="direccion">Dirección de Entrega</label>
        <input type="text" id="direccion" name="entry.2180338986" placeholder="Ej. Calle 10 # 5-20" required>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">
        📦 Enviar Pedido
      </button>
    </form>
    <p class="footer-note">Tus datos están seguros y solo se usarán para procesar este envío.</p>
    <a href="index.html" class="back-link">← Volver a la tienda</a>
  </div>

  <!-- IFRAME OCULTO para enviar datos a Google Forms -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    // 1. Leer datos del producto desde la URL
    const params = new URLSearchParams(window.location.search);
    const producto = params.get('producto') || 'Producto no especificado';
    const precio = params.get('precio') || '$0';
    const imagen = params.get('imagen') || '';
    
    // 2. Mostrar producto en la página
    document.getElementById('prodName').innerText = producto;
    document.getElementById('prodPrice').innerText = precio;
    document.getElementById('producto').value = producto;
    document.getElementById('precio').value = precio;
    
    if (imagen) {
      document.getElementById('prodImg').src = imagen;
    } else {
      document.getElementById('prodImg').src = 'https://via.placeholder.com/300x300/131c2e/ffffff?text=Pywi';
    }

    // 3. Manejar el envío del formulario
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '⏳ Registrando datos...';
      btn.disabled = true;
      
      // 4. ENVIAR DATOS A GOOGLE FORMS VIA IFRAME OCULTO
      const form = document.getElementById('orderForm');
      form.target = 'hidden_iframe';
      form.action = 'https://docs.google.com/forms/d/e/1FAIpQLSdT05ouhbZAHC99iiIKm6_kNdvD156jNJVz_8sNEocUlJZPEw/formResponse';
      form.method = 'POST';
      form.submit();
      
      // Mostrar mensaje de éxito
      document.getElementById('successMsg').style.display = 'block';
      btn.innerHTML = '✅ Pedido registrado exitosamente';
      
      // Scroll al mensaje de éxito
      document.getElementById('successMsg').scrollIntoView({ behavior: 'smooth', block: 'center' });

      setTimeout(() => { 
        btn.innerHTML = '📦 Enviar Pedido'; 
        btn.disabled = false; 
      }, 3000);
    });
  </script>
</body>
</html>
